name: Publish RubyGem

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby' 
          bundler-cache: true

      - name: Check version and publish
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure credentials are setup for pushing
          mkdir -p $HOME/.gem
          touch $HOME/.gem/credentials
          chmod 0600 $HOME/.gem/credentials
          printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials

          # Extract version from the version file
          VERSION=$(ruby -r ./lib/omi/clients/version.rb -e 'puts Omi::Clients::VERSION')
          GEM_NAME="omi-clients"
          
          echo "Current version in code: v${VERSION}"

          # Check if the version is already published on RubyGems
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://rubygems.org/api/v1/versions/${GEM_NAME}.json")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            if curl -s "https://rubygems.org/api/v1/versions/${GEM_NAME}.json" | grep -q "\"number\":\"${VERSION}\""; then
              echo "Version ${VERSION} is already published on RubyGems. Skipping."
              exit 0
            fi
          fi

          echo "Version ${VERSION} is not published yet. Proceeding with publish..."

          # Build and push the gem
          gem build ${GEM_NAME}.gemspec
          gem push ${GEM_NAME}-${VERSION}.gem

          # Tag the release in git and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

          # Create a GitHub Release
          gh release create "v${VERSION}" --title "Release v${VERSION}" --generate-notes
